# Render Blueprint. Render → New → Blueprint → bu depoyu seçin.
# Ücretsiz plan: 15 dakika boşta kalınca uyur, taramalar silinir. Excel'i hemen indirin.
services:
  - type: web
    name: seo-audit
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_MODE
        value: "1"
      - key: EPHEMERAL_STORAGE
        value: "1"
    # v0.8.4: no password (user decision). To add one again: APP_USER and APP_PASS (10+ characters) in Render → Environment.
